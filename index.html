<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>أميمة 💕</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Tajawal', sans-serif;
      background: linear-gradient(135deg, #ffe0ec 0%, #ffc2d4 50%, #ffb3c6 100%);
      overflow: hidden;
    }

    /* Floating hearts background */
    .hearts-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
    }
    .heart-float {
      position: absolute;
      font-size: 1.5rem;
      animation: floatUp linear infinite;
      opacity: 0.4;
    }
    @keyframes floatUp {
      0%   { transform: translateY(110vh) rotate(0deg); opacity: 0.4; }
      100% { transform: translateY(-10vh) rotate(20deg); opacity: 0; }
    }

    /* Card */
    .card {
      position: relative;
      z-index: 1;
      background: white;
      border-radius: 32px;
      padding: 48px 40px 40px;
      max-width: 360px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(255, 100, 130, 0.25);
      animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }
    @keyframes popIn {
      from { transform: scale(0.7); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }

    /* Cat illustration */
    .cat-wrap {
      font-size: 5rem;
      margin-bottom: 8px;
      animation: bounce 2s ease-in-out infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-10px); }
    }

    h1 {
      font-size: 1.9rem;
      font-weight: 900;
      color: #e8265e;
      line-height: 1.4;
      margin-bottom: 32px;
    }

    .buttons {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-yes {
      background: linear-gradient(135deg, #ff4d80, #e8265e);
      color: white;
      border: none;
      border-radius: 50px;
      padding: 14px 36px;
      font-size: 1.2rem;
      font-family: 'Tajawal', sans-serif;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(232, 38, 94, 0.4);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn-yes:hover {
      transform: scale(1.08);
      box-shadow: 0 8px 28px rgba(232, 38, 94, 0.5);
    }
    .btn-yes:active { transform: scale(0.97); }

    .btn-no {
      background: #eee;
      color: #999;
      border: none;
      border-radius: 50px;
      padding: 14px 36px;
      font-size: 1.2rem;
      font-family: 'Tajawal', sans-serif;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, font-size 0.2s;
      position: relative;
    }

    /* Success screen */
    .success {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .success.show { display: flex; }
    .card.hide-content .question-area { display: none; }
    .card.hide-content .success { display: flex; }

    .success-emoji { font-size: 4rem; animation: spin 0.6s ease; }
    @keyframes spin {
      from { transform: rotate(-20deg) scale(0); }
      to   { transform: rotate(0) scale(1); }
    }
    .success h2 {
      font-size: 1.7rem;
      font-weight: 900;
      color: #e8265e;
    }
    .success p {
      font-size: 1.1rem;
      color: #f47aa7;
    }

    /* Confetti */
    .confetti-piece {
      position: fixed;
      width: 10px; height: 10px;
      border-radius: 2px;
      animation: confettiFall 1.5s ease forwards;
      z-index: 999;
      pointer-events: none;
    }
    @keyframes confettiFall {
      0%   { transform: translateY(-20px) rotate(0); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- Floating hearts -->
  <div class="hearts-bg" id="heartsBg"></div>

  <div class="card" id="card">
    <!-- Question -->
    <div class="question-area" id="questionArea">
      <div class="cat-wrap">🐱💕🐱</div>
      <h1>أميمة تحبيني لو لا؟ 🥺</h1>
      <div class="buttons">
        <button class="btn-yes" onclick="sayYes()">أي 💖</button>
        <button class="btn-no" id="noBtn" onmouseover="runAway()" ontouchstart="runAway()">لا</button>
      </div>
    </div>

    <!-- Success -->
    <div class="success" id="successArea">
      <div class="success-emoji">💞</div>
      <h2>يييي!! 🎉</h2>
      <p>أنا أحبك أكثر!! 💕</p>
      <div style="font-size:2.5rem; margin-top:8px;">🐱🤍🐱</div>
    </div>
  </div>

  <script>
    // Generate floating hearts
    const bg = document.getElementById('heartsBg');
    const emojis = ['💕','💗','💓','💖','🩷','❤️','💝'];
    for (let i = 0; i < 18; i++) {
      const h = document.createElement('div');
      h.className = 'heart-float';
      h.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      h.style.left = Math.random() * 100 + 'vw';
      h.style.animationDuration = (4 + Math.random() * 5) + 's';
      h.style.animationDelay = (Math.random() * 6) + 's';
      h.style.fontSize = (1 + Math.random() * 1.5) + 'rem';
      bg.appendChild(h);
    }

    // No button runs away
    let noSize = 1.2;
    function runAway() {
      const btn = document.getElementById('noBtn');
      noSize = Math.max(0.5, noSize - 0.15);
      btn.style.fontSize = noSize + 'rem';
      const x = (Math.random() - 0.5) * 200;
      const y = (Math.random() - 0.5) * 200;
      btn.style.transform = `translate(${x}px, ${y}px)`;
    }

    function sayYes() {
      document.getElementById('questionArea').style.display = 'none';
      document.getElementById('successArea').classList.add('show');
      launchConfetti();
    }

    function launchConfetti() {
      const colors = ['#ff4d80','#ffc2d4','#ff85a1','#fff','#e8265e','#ffb3c6'];
      for (let i = 0; i < 80; i++) {
        setTimeout(() => {
          const c = document.createElement('div');
          c.className = 'confetti-piece';
          c.style.left = Math.random() * 100 + 'vw';
          c.style.background = colors[Math.floor(Math.random() * colors.length)];
          c.style.animationDuration = (1 + Math.random()) + 's';
          c.style.animationDelay = Math.random() * 0.5 + 's';
          document.body.appendChild(c);
          setTimeout(() => c.remove(), 2500);
        }, i * 20);
      }
    }
  </script>
</body>
</html>
